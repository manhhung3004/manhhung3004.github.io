<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Đến Trường</title>
    <link rel="stylesheet" href="assets/css/directions-map.css">
</head>

<body>
    <div class="directions-container">
        <div class="directions-header">
            <h1>Hướng Dẫn Đến Trường</h1>
            <p>Vui lòng xem sơ đồ chi tiết bên dưới</p>
        </div>

        <div class="map-image-container">
            <!-- 
                HƯỚNG DẪN THAY ẢNH BẢN ĐỒ:
                Thay đổi đường dẫn bên dưới để sử dụng ảnh bản đồ của bạn
                Ví dụ:
                - Ảnh local: src="assets/images/school-map.jpg"
                - Ảnh online: src="https://example.com/map.jpg"
                - Screenshot từ Google Maps với đường dẫn rõ ràng
                Khuyến nghị: Kích thước 1200x800px hoặc tỷ lệ tương tự
            -->
            <img src="assets/images/Map-UIT.jpg" alt="Sơ đồ hướng dẫn đến trường - Thay thế bằng ảnh bản đồ thực tế">
        </div>

        <div class="instruction-text">
            <strong>Địa chỉ:</strong> [Thay thế bằng địa chỉ cụ thể]<br>
            <strong>Liên hệ:</strong> [Thay thế bằng số điện thoại]<br>
            <strong>Bãi đỗ xe:</strong> [Thay thế bằng thông tin bãi đỗ xe]
        </div>

        <div class="back-button-container">
            <a href="index.html" class="btn">← Quay Lại Thiệp Mời</a>
        </div>
    </div>
</body>

</html>
