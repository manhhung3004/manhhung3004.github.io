# Builds the Next.js blog in web/ and publishes web/out to GitHub Pages.
# Requires Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # shortcut: while Settings > Pages still deploys from the branch, GitHub also runs its own
      # "pages build and deployment" for this commit and can overwrite this deploy. Wait for it so
      # this deploy lands last. Remove once Pages Source is "GitHub Actions".
      - name: Wait for the branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 30); do
            status=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
              | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "none"')
            echo "branch-based Pages build: $status"
            [ "$status" = completed ] && break
            [ "$status" = none ] && [ "$i" -ge 6 ] && break   # no such run after 60s: Source is already Actions
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
