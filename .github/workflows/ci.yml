# Checks every feature branch; a green branch is fast-forwarded into main and deployed
# (see CLAUDE.md > Delivery pipeline). Old branches such as legacy-vcard-site are never promoted.
name: CI

on:
  push:
    branches: ['feat/**', 'fix/**', 'chore/**', 'docs/**', 'content/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (also validates post frontmatter)
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  promote:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: promote-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward main to this commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has moved on. Run 'git merge origin/main' on this branch and push again."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/main"
      # Pushes made with GITHUB_TOKEN do not trigger other workflows; workflow_dispatch is the exception.
      - name: Start the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
